<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Styled To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Contenedor principal (El cuadro grande de fondo) -->
  <div class="todo-container">
    <h1>Mi lista de tareas</h1>

    <ul class="todo-list">
      <!-- Tarea 1 -->
      <li>
        <input type="checkbox" id="task-1">
        <label for="task-1">Explora teclados para juegos</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link" href="https://freecodecamp.org" target="_blank">Enlace a la tienda</a>
          </li>
        </ul>
      </li>

      <!-- Tarea 2 -->
      <li>
        <input type="checkbox" id="task-2">
        <label for="task-2">Termina el informe</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link" href="https://freecodecamp.org" target="_blank">Solicitar acceso</a>
          </li>
        </ul>
      </li>

      <!-- Tarea 3 -->
      <li>
        <input type="checkbox" id="task-3">
        <label for="task-3">Ver la garantía del teléfono</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link" href="https://freecodecamp.org" target="_blank">Ver recibos</a>
          </li>
        </ul>
      </li>

      <!-- Tarea 4 -->
      <li>
        <input type="checkbox" id="task-4">
        <label for="task-4">Configurar entorno de desarrollo</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link" href="https://freecodecamp.org" target="_blank">Documentación oficial</a>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</body>
</html>
